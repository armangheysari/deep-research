<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deep Research</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="hero">
    <div class="bars">
      <span class="bar amber"></span>
      <span class="bar blue"></span>
      <span class="bar purple"></span>
    </div>
    <h1>DEEP / RESEARCH</h1>
    <p class="subtitle">تحقیق عمیق چندمرحله‌ای اینترنتی</p>
  </header>

  <main class="container">
    <section id="step-research" class="step active">
      <h2>سوال خود را وارد کنید</h2>
      <textarea id="query" placeholder="مثلاً: محبوب‌ترین فریم‌ورک‌های ایجنتیک در سال ۲۰۲۶ کدامند؟" rows="3"></textarea>
      <button id="btn-research" class="btn primary">شروع تحقیق</button>
    </section>

    <section id="step-output" class="step">
      <h2>در حال تحقیق…</h2>
      <div id="status" class="status"></div>
      <article id="report" class="report"></article>
    </section>
  </main>

  <footer>
    <small>ساخته‌شده با OpenRouter + OpenAI Agents SDK + DuckDuckGo</small>
  </footer>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
